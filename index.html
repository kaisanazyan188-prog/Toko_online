
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaisan Shoes</title>

<style>
* {
box-sizing: border-box;
}

body {
font-family: Arial;
margin: 0;
background: #fafafa;
color: #222;
}

header {
background: white;
padding: 20px 25px;
font-size: 23px;
font-weight: bold;
position: sticky;
top: 0;
}

.hero {
background: #222;
color: white;
padding: 50px 25px;
}

.hero h1 {
font-size: 35px;
}

.hero button {
background: #b65c27;
color: white;
border: none;
padding: 13px 20px;
}

section {
padding: 20px 25px;
}

.card {
background: white;
margin: 20px 0;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 2px 7px #ddd;
}

.card img {
width: 100%;
height: 230px;
object-fit: cover;
}

.isi {
padding: 20px;
}

.harga {
color: #a65322;
font-weight: bold;
font-size: 20px;
}

.detail {
background: none;
text-decoration: underline;
float: right;
}

.form {
display: none;
margin-top: 25px;
border-top: 1px solid #ddd;
padding-top: 15px;
}

.notes {
background: #f5f5f5;
padding: 15px;
margin-bottom: 15px;
line-height: 1.6;
}

input, textarea, select {
width: 100%;
padding: 13px;
margin: 7px 0;
border: 1px solid #ddd;
border-radius: 6px;
}

textarea {
height: 85px;
}

button {
cursor: pointer;
border-radius: 5px;
}

.wa {
width: 100%;
background: #087c58;
color: white;
padding: 15px;
border: none;
margin-top: 10px;
font-size: 16px;
}

footer {
background: #222;
color: white;
text-align: center;
padding: 25px;
}

@media(min-width:700px) {
#daftar {
display: grid;
grid-template-columns: repeat(2,1fr);
gap: 20px;
}
}
</style>
</head>

<body>

<header>👟 KAISAN SHOES</header>

<div class="hero">
<h1>STEP INTO STYLE</h1>
<p>Temukan sepatu favoritmu dengan desain keren dan harga terjangkau.</p>
<button onclick="location.href='#produk'">
Belanja Sekarang
</button>
</div>

<section id="produk">
<h2>Koleksi Sepatu</h2>
<p>Pilih sepatu favoritmu sekarang!</p>

<div id="daftar"></div>
</section>

<footer>
<h3>KAISAN SHOES</h3>
<p>Pesan sepatu melalui WhatsApp</p>
<p>085285761927</p>
<p>© 2026 Kaisan Shoes</p>
</footer>

<script src="script.js"></script>

</body>
</html>
